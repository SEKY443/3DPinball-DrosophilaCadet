name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment, but don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the prebuilt engine
        # The WASM engine is built locally (scripts/build_wasm.sh) and committed as web/dist/: its .data package
        # already contains the game table and the sound effects, so the original game files are never stored
        # in this repository and CI does not need them.
        run: |
          for f in SpaceCadetPinball.js SpaceCadetPinball.wasm SpaceCadetPinball.data; do
            test -f "web/dist/$f" || { echo "::error::web/dist/$f missing - run ./scripts/build_wasm.sh and commit web/dist"; exit 1; }
          done

      - name: Verify the browser brain matches Python
        # The page runs two controllers: the untrained retinotopic giant-fiber body (default) and the
        # lead-trained popcode fly brain. Each JS forward pass must reproduce the exported Python test
        # vectors (zero action mismatches, float32 tolerance).
        run: >
          node web/test/verify_policy.mjs web/connectome_444.json web/circuit_readout_444_popcode.json
          web/testdata/circuit_444_popcode_vectors.json
          && node web/test/verify_gf_body.mjs web/gf_body_split.json web/testdata/gf_body_split_vectors.json

      - name: Assemble Pages artifact
        # Only what index.html loads - no test data, backups or older brains.
        run: |
          mkdir -p _site/dist _site/paint
          cp web/index.html web/bridge.js web/circuit_policy.js web/observation.js web/brain_dashboard.js web/gf_body.js \
             web/xp_menu.js web/xp_scrollbar.js web/dom.js web/lowres.js web/fly_names.js web/score_history.js web/paint.js \
             web/splash.png web/bliss.jpg web/favicon.png web/ie_shortcut.png \
             web/connectome_444.json web/circuit_readout_444_popcode.json web/gf_body_split.json _site/
          cp web/paint/fly_idle.png web/paint/fly_left.png web/paint/fly_right.png _site/paint/
          cp web/dist/SpaceCadetPinball.js web/dist/SpaceCadetPinball.wasm web/dist/SpaceCadetPinball.data _site/dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
