name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src_cpp/**"
      - "scripts/build_wasm.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment, but don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14
        with:
          # Pinned to the version the page was last verified with locally (scripts/build_wasm.sh).
          version: 6.0.10

      - name: Build wasm
        run: ./scripts/build_wasm.sh

      - name: Check game data
        # Game data is NOT in this repository (copyright; see README). Without it the engine has no
        # table and the canvas stays black. How the public page gets game data is still undecided -
        # until then the deploy goes ahead but flags it loudly.
        run: |
          if [ ! -f web/dist/SpaceCadetPinball.data ]; then
            echo "::warning::No game data packaged (vendor/SpaceCadetPinball/bin/DEMO.DAT absent) - the deployed page will show a black table."
          fi

      - name: Verify the browser brain matches Python
        # The page runs only the lead-trained popcode fly brain; its JS forward pass must reproduce
        # the exported Python test vectors (float32 tolerance, zero action mismatches).
        run: >
          node web/test/verify_policy.mjs web/connectome_444.json web/circuit_readout_444_popcode.json
          web/testdata/circuit_444_popcode_vectors.json

      - name: Assemble Pages artifact
        # Only what index.html loads - no test data, backups or older brains.
        run: |
          mkdir -p _site/dist
          cp web/index.html web/bridge.js web/circuit_policy.js web/observation.js web/brain_dashboard.js \
             web/connectome_444.json web/circuit_readout_444_popcode.json _site/
          cp web/dist/SpaceCadetPinball.js web/dist/SpaceCadetPinball.wasm _site/dist/
          if [ -f web/dist/SpaceCadetPinball.data ]; then cp web/dist/SpaceCadetPinball.data _site/dist/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
